services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kart
      POSTGRES_USER: kart
      POSTGRES_PASSWORD: kart_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - kart-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kart -d kart"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kart-db:
